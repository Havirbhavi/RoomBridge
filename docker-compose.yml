services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: roombridge
      POSTGRES_USER: roombridge
      POSTGRES_PASSWORD: roombridge-local
    ports: ["5432:5432"]
    volumes:
      - roombridge-postgres:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: bitnami/kafka:4.0
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

  ai-service:
    build: ./ai-service
    environment:
      ROOMPROOF_DATA_DIR: /data
      DATABASE_URL: postgresql://roombridge:roombridge-local@postgres:5432/roombridge
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_ENV: local-docker
      SPLUNK_HEC_URL: http://splunk:8088/services/collector/event
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-roombridge-local-hec-token}
    ports: ["8001:8001"]
    volumes: ["roomproof-data:/data"]
    depends_on: [postgres, redis, kafka]

  splunk:
    image: splunk/splunk:9.4
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-RoomBridgeLocal1!}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-roombridge-local-hec-token}
    ports:
      - "8000:8000"
      - "8088:8088"
    volumes:
      - roombridge-splunk:/opt/splunk/var
      - ./infrastructure/splunk/roombridge:/opt/splunk/etc/apps/roombridge:ro

  mcp-server:
    build: ./mcp-server
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8002
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,mcp-server
      ROOMBRIDGE_API_URL: http://api:4000/api
      MCP_AUDIT_FILE: /data/audit.jsonl
    ports: ["8002:8002"]
    volumes: ["mcp-audit:/data"]

  listing-review:
    build: ./listing-review-service
    environment:
      APP_NAME: RoomBridge Listing Review
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${LISTING_REVIEW_APP_KEY:-base64:dpxZB54CAodPcIN3eo64+FKVPlVrCjTdVzi/XS4tLhI=}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: roombridge
      DB_USERNAME: roombridge
      DB_PASSWORD: roombridge-local
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    ports: ["8010:8010"]
    depends_on: [postgres]

  api:
    build: ./server
    environment:
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
      AI_SERVICE_URL: http://ai-service:8001
      MCP_SERVER_URL: http://mcp-server:8002/mcp
      LISTING_REVIEW_URL: http://listing-review:8010
      DATABASE_URL: postgresql://roombridge:roombridge-local@postgres:5432/roombridge
    ports: ["4000:4000"]
    depends_on: [postgres, ai-service, mcp-server, listing-review]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [ai-service]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: roombridge-local
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3001:3000"]
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  roombridge-postgres:
  roomproof-data:
  mcp-audit:
  roombridge-splunk:
