services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: roombridge
      POSTGRES_USER: roombridge
      POSTGRES_PASSWORD: roombridge-local
    ports: ["5432:5432"]
    volumes:
      - roombridge-postgres:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: bitnami/kafka:4.0
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

  ai-service:
    build: ./ai-service
    environment:
      ROOMPROOF_DATA_DIR: /data
      DATABASE_URL: postgresql://roombridge:roombridge-local@postgres:5432/roombridge
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8001:8001"]
    volumes: ["roomproof-data:/data"]
    depends_on: [postgres, redis, kafka]

  mcp-server:
    build: ./mcp-server
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8002
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,mcp-server
      ROOMBRIDGE_API_URL: http://api:4000/api
      MCP_AUDIT_FILE: /data/audit.jsonl
    ports: ["8002:8002"]
    volumes: ["mcp-audit:/data"]

  api:
    build: ./server
    environment:
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
      AI_SERVICE_URL: http://ai-service:8001
      MCP_SERVER_URL: http://mcp-server:8002/mcp
      DATABASE_URL: postgresql://roombridge:roombridge-local@postgres:5432/roombridge
    ports: ["4000:4000"]
    depends_on: [postgres, ai-service, mcp-server]

volumes:
  roombridge-postgres:
  roomproof-data:
  mcp-audit:
