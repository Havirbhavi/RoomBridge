apiVersion: apps/v1
kind: Deployment
metadata:
  name: roomproof-ai
spec:
  replicas: 2
  selector:
    matchLabels: { app: roomproof-ai }
  template:
    metadata:
      labels: { app: roomproof-ai }
    spec:
      containers:
        - name: api
          image: roombridge/roomproof-ai:latest
          ports: [{ containerPort: 8001 }]
          env:
            - name: ROOMPROOF_DATA_DIR
              value: /data
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: roomproof-ai
spec:
  selector: { app: roomproof-ai }
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: roomproof-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: roomproof-ai
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
