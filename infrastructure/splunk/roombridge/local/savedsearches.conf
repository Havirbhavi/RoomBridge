[RoomBridge - Elevated AI error rate]
search = sourcetype="roombridge:json" event_type="http_request_completed" status>=500 | stats count as errors | where errors >= 5
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert_type = number of results
alert_comparator = greater than
alert_threshold = 0
enableSched = 1
disabled = 0

[RoomBridge - Grounding failures]
search = sourcetype="roombridge:json" event_type="comparison_completed" grounding="failed" | stats count as failures, avg(grounding_retries) as avg_retries | where failures >= 3
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
alert_type = number of results
alert_comparator = greater than
alert_threshold = 0
enableSched = 1
disabled = 0

[RoomBridge - High Q&A abstention]
search = sourcetype="roombridge:json" event_type="roomproof_question_completed" | stats count as questions, count(eval(outcome="abstained")) as abstained | eval abstention_rate=round(100*abstained/questions,2) | where questions>=5 AND abstention_rate>30
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert_type = number of results
alert_comparator = greater than
alert_threshold = 0
enableSched = 1
disabled = 0
